apiVersion: apps/v1
kind: Deployment
metadata:
  name: settl-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: settl-backend
  template:
    metadata:
      labels:
        app: settl-backend
    spec:
      serviceAccountName: settl-backend-sa
      containers:
        - name: backend
          image: quay.io/pranil-shripad/settl-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: settl-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: backend-storage
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /healthz
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: settl-backend-pvc