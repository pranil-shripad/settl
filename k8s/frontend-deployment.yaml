apiVersion: apps/v1
kind: Deployment
metadata:
  name: settl-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: settl-frontend
  template:
    metadata:
      labels:
        app: settl-frontend
    spec:
      containers:
        - name: frontend
          image: quay.io/pranil-shripad/settl-frontend:v1
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: settl-frontend-svc
spec:
  selector:
    app: settl-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: settl-frontend-route
spec:
  to:
    kind: Service
    name: settl-frontend-svc
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
