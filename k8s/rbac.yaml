apiVersion: v1
kind: ServiceAccount
metadata:
  name: settl-backend-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: settl-backend-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["settl-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: settl-backend-rolebinding
subjects:
  - kind: ServiceAccount
    name: settl-backend-sa
roleRef:
  kind: Role
  name: settl-backend-role
  apiGroup: rbac.authorization.k8s.io